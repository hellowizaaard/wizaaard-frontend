<nav class="navbar navbar-light bg-light fixed-top">
    <div class="container position-relative">

        <!-- LEFT: LOGO -->
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="img/Group.png" class="me-2">
            <img src="img/Group_logo.png">
        </a>

        <!-- RIGHT SIDE -->
        <div class="d-flex align-items-center ms-auto position-relative">

            @if(!user) {
            <a [routerLink]="routeUrls?.login" class="btn btn-outline-primary me-2">
                Start with Login
            </a>
            <a [routerLink]="routeUrls?.register" class="btn btn-primary me-3" style="background:#000D33;">
                Register
            </a>
            }

            @else {
            <div ngbDropdown class="me-3">
                <a class="nav-link" ngbDropdownToggle>{{ user?.name }}</a>
                <div ngbDropdownMenu class="dropdown-menu-end">
                    <a ngbDropdownItem [routerLink]="routeUrls?.profile">Profile</a>
                    <a ngbDropdownItem (click)="logout()">Logout</a>
                </div>
            </div>
            }

            <!-- 🔵 HAMBURGER -->
            <button class="custom-toggler" (click)="toggleMenu($event)">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- 🔥 POPUP MENU -->
            <div class="menu-popup" *ngIf="menuOpen">
                <ul class="list-unstyled m-0">
                    <li><a (click)="navigate(routeUrls?.home)">Home</a></li>
                    <li><a (click)="navigate(routeUrls?.aboutUs)">About</a></li>
                    <li><a (click)="navigate(routeUrls?.faq)">FAQ</a></li>
                    <li><a (click)="navigate(routeUrls?.contact)">Contact</a></li>
                    <li><a (click)="navigate(routeUrls?.termsConditions)">Terms & Conditions</a></li>
                </ul>
            </div>

        </div>
    </div>
</nav>
