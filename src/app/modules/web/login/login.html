<div class="container-center">
    <div class="col-xl-4 col-lg-6 col-md-6 col-sm-9 col-12 offset-xl-4 offset-lg-3 offset-md-3 offset-sm-2">
        <div class="card">
            <div class="card-header bg-white text-center">
                <h2 class="mb-0">{{ appName }} Login</h2>
            </div>
            <div class="card-body">
                <div class="col-12" *ngIf="errors.length">
                    <div class="alert alert-danger alert-dismissible fade show" role="alert" *ngFor="let error of errors">
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        {{ error }}
                    </div>
                </div>
                <form [formGroup]="loginForm" (ngSubmit)="submit()">
                    <div class="row">
                        <div class="col-12">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" formControlName="email" placeholder="Email" required>
                                <label for="email" class="">Email</label>
                                <div class="" *ngIf="f['email'].touched && f['email'].invalid">
                                    <div class="text-danger" *ngIf="f['email'].errors?.['email']">Email is invalid!</div>
                                    <div class="text-danger" *ngIf="f['email'].errors?.['required']">Email is required!</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="form-floating mb-3">
                                <input type="{{ passwordVisible ? 'text' : 'password' }}" class="form-control" formControlName="password" placeholder="Password" required>
                                <label for="password" class="">Password</label>
                                <div class="" *ngIf="f['password'].touched && f['password'].invalid">
                                    <div class="text-danger" *ngIf="f['password'].errors?.['required']">Password is required!</div>
                                </div>
                                <small class="text-muted pull-right pointer" (click)="viewPassword()"><span *ngIf="!passwordVisible">Show</span><span *ngIf="passwordVisible">Hide</span></small>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="form-group text-center mb-3" *ngIf="validationFailed">
                                <small class="text-danger">Credentials does not matched!!!</small>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                                    <label class="form-check-label" for="flexCheckDefault">
                                      Remember me
                                    </label>
                                </div>                          
                            </div>
                        </div>
                        <div class="col-6 text-right">
                            <a class="btn-link" [routerLink]="'/'+routeUrls?.forgotPassword">Forgot password?</a>
                        </div>
                    </div>
                    <div class="form-group mt-3">
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </div>
                    <div class="form-group mt-3 text-center">
                        do not have an account? <a (click)="onClickRegister()" class="btn-link">Click to Register</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
